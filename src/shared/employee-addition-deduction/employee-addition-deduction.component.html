<!-- Dialog Header -->
<div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
  <button
    pButton
    icon="pi pi-times"
    class="p-button-rounded p-button-text p-button-plain close-btn"
    (click)="closeDialog()"
    pTooltip="Close"
    tooltipPosition="left"
  ></button>
</div>

<!-- Add New Button -->
<div class="add-button-container" style="margin-bottom: 1.5rem;">
  <button
    pButton
    label="Add New"
    icon="pi pi-plus"
    (click)="showAddForm = true"
    [disabled]="isSubmitiing || showAddForm"
    [loading]="isSubmitiing"
  ></button>
</div>

<!-- Add Form -->
<div *ngIf="showAddForm" style="margin-top: 1.5rem; padding: 1rem; border: 1px solid #ccc; border-radius: 8px;">
  <form [formGroup]="form" (ngSubmit)="submitNewEntry()">
    <div
      class="p-grid"
      style="row-gap: 1rem; column-gap: 1rem; align-items: center;"
    >
      <div class="p-col-12 p-md-4 mb-2">
        <label for="name" style="font-weight: 500; display: block; margin-bottom: 0.25rem;">Name</label>
        <input
          id="name"
          pInputText
          formControlName="Name"
          placeholder="Enter name"
          style="width: 100%;"
        />
      </div>

      <div class="p-col-12 p-md-4 mb-2" *ngIf="!isTypeDisabled">
        <label for="type" style="font-weight: 500; display: block; margin-bottom: 0.25rem;">Type</label>
        <p-select
          inputId="type"
          [options]="[
            { label: 'Addition', value: 'ADDITION' },
            { label: 'Deduction', value: 'DEDUCTION' }
          ]"
          placeholder="Select Type"
          formControlName="Type"
          styleClass="w-full"
        ></p-select>
      </div>

      <div class="p-col-12 p-md-4 mb-2">
        <label for="value" style="font-weight: 500; display: block; margin-bottom: 0.25rem;">Value</label>
        <input
          id="value"
          pInputText
          type="number"
          formControlName="Value"
          min="0"
          placeholder="Enter value"
          style="width: 100%;"
        />
      </div>
    </div>

    <div
      class="flex justify-end gap-1"
      style="margin-top: 1.5rem; gap: 0.75rem;"
    >
      <button
        pButton
        type="submit"
        label="Save"
      ></button>

      <button
        pButton
        type="button"
        label="Cancel"
        class="p-button-secondary"
        (click)="cancelAddForm()"
      ></button>
    </div>
  </form>
</div>

  <div *ngIf="employeeAddDedList.length === 0 && !isLoading"  class="flex flex-col items-center justify-center py-20">
    <div class="text-6xl text-gray-300 dark:text-gray-600 mb-1">
      <i class="pi pi-user-tie" style="font-size: 3rem"></i>
    </div>
    <h3 class="text-2xl font-bold text-gray-700 dark:text-gray-300 mb-3">
      No entries found for this employee.
    </h3>
    <p class="text-gray-500 dark:text-gray-400 mb-8 text-center max-w-md">

      Create your first Entry to get started.
    </p>
  </div>

  <div *ngIf="isLoading" class="p-4 text-center flex justify-center items-center py-20">
    <div class="inline-flex items-center space-x-2 text-surface-500">
      <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="m4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
      </svg>
      <span class="text-sm">Loading...</span>
    </div>
  </div>

<!-- Data Table -->
<p-table
  *ngIf="employeeAddDedList.length > 0 && !isLoading"
  [value]="employeeAddDedList"
  [style]="{ marginTop: '1rem' }"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Name</th>
      <th>Type</th>
      <th>Value</th>
      <th style="text-align: center;">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-entry>
    <tr>
      <td>{{ entry.Name || '-' }}</td>
      <td>{{ entry.Type }}</td>
      <td>{{ entry.Value }}</td>
      <td style="text-align: center;">
        <button
          pButton
          type="button"
          icon="pi pi-trash"
          class="p-button-rounded p-button-danger"
          (click)="deleteEntry(entry.AdditionsOrDeductionsId)"
          pTooltip="Delete"
          tooltipPosition="top"
        ></button>
      </td>
    </tr>
  </ng-template>
</p-table>
