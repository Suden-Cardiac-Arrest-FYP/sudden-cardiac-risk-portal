<div class="resolve-attendance-container">

  <form [formGroup]="irregularAttendanceForm" (ngSubmit)="save()" class="space-y-6">
    <!-- Attendance Info Display -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6 bg-gray-100 dark:bg-gray-800 p-4 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm">
  <!-- Date -->
  <div class="flex flex-col">
    <span class="text-sm text-gray-500 dark:text-gray-400">Date</span>
    <span class="text-lg font-medium text-gray-800 dark:text-white">
      {{ irregularAttendanceForm.get('Date')?.value || '—' }}
    </span>
  </div>

  <!-- Shift Start Time -->
  <div class="flex flex-col">
    <span class="text-sm text-gray-500 dark:text-gray-400">Shift Start Time</span>
    <span class="text-lg font-medium text-gray-800 dark:text-white">
      {{ irregularAttendanceForm.get('ShiftStartTime')?.value || '—' }}
    </span>
  </div>

  <!-- Shift End Time -->
  <div class="flex flex-col">
    <span class="text-sm text-gray-500 dark:text-gray-400">Shift End Time</span>
    <span class="text-lg font-medium text-gray-800 dark:text-white">
      {{ irregularAttendanceForm.get('ShiftEndTime')?.value || '—' }}
    </span>
  </div>
</div>

    <!-- Time Entries Section -->
    <div>
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">Time Entries</h3>
        <p-button 
          icon="pi pi-plus" 
          label="Add Time Pair"
          severity="secondary" 
          size="small"
          (onClick)="addTimePair()"
          type="button">
        </p-button>
      </div>

      <div formArrayName="time" class="space-y-6">
        <div 
          *ngFor="let timePair of timeArray.controls; let i = index" 
          [formGroupName]="i" 
          class="bg-gray-50 dark:bg-gray-800 p-4 rounded-md shadow-sm border border-gray-200 dark:border-gray-700 space-y-4">

          <div class="flex justify-between items-center">
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Time Entry {{ i + 1 }}</span>
            <p-button 
              *ngIf="timeArray.length > 1"
              icon="pi pi-trash" 
              severity="danger" 
              size="small"
              text="true"
              (onClick)="removeTimePair(i)"
              type="button">
            </p-button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
            <div class="flex flex-col">
              <label [for]="'inTime-' + i" class="text-sm text-gray-600 dark:text-gray-400">Start Time</label>
              <input 
                pInputText 
                [id]="'inTime-' + i"
                formControlName="inTime"
                placeholder="HH:MM"
                maxlength="5"
                (input)="formatTimeInput($event, 'inTime', i)"
                class="time-input p-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
            </div>

            <div class="flex flex-col">
              <label [for]="'endTime-' + i" class="text-sm text-gray-600 dark:text-gray-400">End Time</label>
              <input 
                pInputText 
                [id]="'endTime-' + i"
                formControlName="endTime"
                placeholder="HH:MM"
                maxlength="5"
                (input)="formatTimeInput($event, 'endTime', i)"
                class="time-input p-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white" />
            </div>
          </div>

          <small 
            *ngIf="timePair.errors?.['timeRange'] && (timePair.dirty || timePair.touched || submitted)" 
            class="text-red-500 text-xs">
            End time must be after start time
          </small>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end gap-4 pt-4">
      <p-button 
        type="button"
        label="Cancel" 
        severity="secondary"
        (onClick)="CloseInstances()"
        [disabled]="isLoading">
      </p-button>

      <p-button 
        type="submit"
        label="Save Time Entries" 
        [loading]="isLoading"
        loadingIcon="pi pi-spinner pi-spin">
      </p-button>
    </div>
  </form>
</div>
