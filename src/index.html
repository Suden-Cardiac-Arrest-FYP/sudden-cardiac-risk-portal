<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SCA-Predict</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://my-fyp-s3-bucket.s3.eu-west-2.amazonaws.com/sca-official-logo.png"
    />
    <link
      href="https://my-fyp-s3-bucket.s3.eu-west-2.amazonaws.com/sca-official-logo.png"
      rel="stylesheet"
    />
    <style>
      /* Basic CSS for the loading animation */
      #loading-screen {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f5f5f5;
        color: #333;
        font-family: "Open Sans", sans-serif;
        font-size: 20px;
        flex-direction: column;
      }

      .logo {
        width: 100px;
        height: 100px;
        animation: subtleScale 2s ease-in-out infinite;
        margin-bottom: 20px;
      }

      @keyframes subtleScale {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }
      #loading-screen div {
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <app-root>
      <div id="loading-screen">
        <img
          class="logo"
          src="https://my-fyp-s3-bucket.s3.eu-west-2.amazonaws.com/sca-official-logo.png"
          alt="Loading Logo"
        />
      </div>
    </app-root>
  </body>
</html>
