<form [formGroup]="attendanceForm" class="card grid grid-cols-1 gap-4 mt-4">
  <div>
    <p-floatlabel class="w-full mt-3">
      <p-select
        formControlName="EmployeeId"
        inputId="EmployeeId"
        [options]="employeeOptions"
        styleClass="w-full"
        optionLabel="label"
        optionValue="value"
        [filter]="true"
        filterBy="label"
        [showClear]="true"
        [class]="getFilledClass('EmployeeId')"
        [loading]="isLoadingEmployees"
        appendTo="body"
      >
        <ng-template #selectedItem let-option>
          <div class="flex items-center gap-2" *ngIf="option">
            <span>{{ option.label }}</span>
          </div>
        </ng-template>
        <ng-template #item let-option>
          <div class="flex items-center gap-2">
            <div class="flex flex-col">
              <span class="font-medium">{{ option.label }}</span>
              <span class="text-xs text-gray-500"
                >{{ option.empId }} - {{ option.department }}</span
              >
            </div>
          </div>
        </ng-template>
      </p-select>
      <label for="EmployeeId">Select Employee</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <p-datepicker
        formControlName="Date"
        showIcon
        iconDisplay="input"
        styleClass="w-full"
        appendTo="body"
      />
      <label for="Date">Date</label>
    </p-floatlabel>
  </div>

  <div>
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100">
        Time Entries
      </h3>
      <p-button
        icon="pi pi-plus"
        label="Add Time Pair"
        severity="secondary"
        size="small"
        (onClick)="addTimePair()"
        type="button"
      >
      </p-button>
    </div>

    <div formArrayName="time" class="space-y-6">
      <div
        *ngFor="let timePair of timeArray.controls; let i = index"
        [formGroupName]="i"
        class="bg-gray-50 dark:bg-gray-800 p-4 rounded-md shadow-sm border border-gray-200 dark:border-gray-700 space-y-4"
      >
        <div class="flex justify-between items-center">
          <span class="text-sm font-medium text-gray-700 dark:text-gray-300"
            >Time Entry {{ i + 1 }}</span
          >
          <p-button
            *ngIf="timeArray.length > 1"
            icon="pi pi-trash"
            severity="danger"
            size="small"
            text="true"
            (onClick)="removeTimePair(i)"
            type="button"
          >
          </p-button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
          <div class="flex flex-col">
            <label
              [for]="'inTime-' + i"
              class="text-sm text-gray-600 dark:text-gray-400"
              >Start Time</label
            >
            <input
              pInputText
              [id]="'inTime-' + i"
              formControlName="inTime"
              placeholder="HH:MM"
              maxlength="5"
              (input)="formatTimeInput($event, 'inTime', i)"
              class="time-input p-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
            />
          </div>

          <div class="flex flex-col">
            <label
              [for]="'endTime-' + i"
              class="text-sm text-gray-600 dark:text-gray-400"
              >End Time</label
            >
            <input
              pInputText
              [id]="'endTime-' + i"
              formControlName="endTime"
              placeholder="HH:MM"
              maxlength="5"
              (input)="formatTimeInput($event, 'endTime', i)"
              class="time-input p-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white"
            />
          </div>
          
        </div>

        <small
          *ngIf="timePair.errors?.['timeRange'] && (timePair.dirty || timePair.touched || submitted)"
          class="text-red-500 text-xs"
        >
          End time must be after start time
        </small>
      </div>
    </div>
  </div>
</form>

<!-- Save and Close Buttons -->
<div class="flex justify-evenly sm:justify-end sm:gap-4 mt-10">
  <div>
    <p-button
      label="Close"
      icon="pi pi-times"
      outlined="true"
      class="w-full sm:w-auto"
      (click)="CloseInstances($event)"
    ></p-button>
  </div>
  <div>
    <p-button
      label="Save"
      icon="pi pi-save"
      [loading]="isLoading"
      class="w-full sm:w-auto"
      (click)="save()"
    ></p-button>
  </div>
</div>
