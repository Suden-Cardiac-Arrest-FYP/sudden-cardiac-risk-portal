<form
  [formGroup]="coveringRequestForm"
  class="card grid grid-cols-1 gap-4 mt-4"
>
  <div>
    <p-floatlabel class="w-full mt-3">
      <input
        pInputText
        id="CustomerName"
        formControlName="CustomerName"
        autocomplete="off"
        class="w-full"
      />
      <label for="CustomerName">Customer Name</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <input
        pInputText
        id="CustomerEmail"
        formControlName="CustomerEmail"
        autocomplete="off"
        class="w-full"
      />
      <label for="CustomerEmail">Customer Email</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <p-datepicker
        formControlName="RequestDate"
        showIcon
        iconDisplay="input"
        styleClass="w-full"
        appendTo="body"
      />
      <label for="RequestDate">Request Date</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <p-select
        formControlName="ProductCategory"
        inputId="ProductCategory"
        [options]="optionsProductCategory"
        styleClass="w-full"
        optionLabel="label"
        optionValue="value"
        [class]="getFilledClass('ProductCategory')"
      >
      </p-select>
      <label for="ProductCategory">Product Category</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <input
        pInputText
        id="Urgent"
        formControlName="Urgent"
        autocomplete="off"
        class="w-full"
      />
      <label for="Urgent">Urgent</label>
    </p-floatlabel>
  </div>
</form>

<!-- Save and Close Buttons -->
<div class="flex justify-evenly sm:justify-end sm:gap-4 mt-10">
  <div>
    <p-button
      label="Close"
      icon="pi pi-times"
      outlined="true"
      class="w-full sm:w-auto"
      (click)="CloseInstances($event)"
    ></p-button>
  </div>
  <div>
    <p-button
      label="Save"
      icon="pi pi-save"
      [loading]="isLoading"
      class="w-full sm:w-auto"
      (click)="save()"
    ></p-button>
  </div>
</div>
