  <div>
    <p-floatlabel class="w-full mt-3">
      <input
        pInputText
        id="Reason"
        formControlName="Reason"
        autocomplete="off"
        class="w-full"
      />
      <label for="Reason">Reason</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <p-datepicker
        id="LeavingDateRange"
        formControlName="LeavingDateRange"
        selectionMode="range"
        dateFormat="dd/mm/yy"
        styleClass="w-full"
        [class]="getFilledClass('LeavingDateRange')"
        appendTo="body"
        [showIcon]="true"
        inputId="LeavingDateRange"
        [style]="{'width': '100%'}"
      />
      <label for="LeavingDateRange">Leaving Date Range</label>
    </p-floatlabel>

    <small
      *ngIf="
        leaveForm.get('LeavingDateRange')?.touched && leaveForm.get('LeavingDateRange')?.hasError('required')
      "
      class="text-red-600"
    >
      Leaving Date Range is required.
    </small>
  </div>

  <!-- Leave Type Dropdown -->
  <!-- <div>
    <p-floatlabel class="w-full mt-3">
      <p-select
        formControlName="LeaveType"

  <!-- Leave Sub Type Dropdown (only shows if showSubType is true) -->
  <div>
    <p-floatlabel class="w-full mt-3">
      <p-select
        formControlName="LeaveSubType"
        inputId="LeaveSubType"
        [options]="optionsLeaveSubType"
        styleClass="w-full"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        [class]="getFilledClass('LeaveSubType')"
        (onChange)="onLeaveTypeChange($event.value)"
      ></p-select>
      <label for="LeaveSubType">Leave Sub Type</label>
    </p-floatlabel>
  </div>

<div *ngIf="showTime">
  <p-floatlabel class="w-full mt-3">
    <p-calendar
      formControlName="Time"
      [showTime]="true"
      [timeOnly]="true"
      hourFormat="24"
      autocomplete="off"
      showIcon
      styleClass="w-full"
      icon="pi pi-clock"
      (onSelect)="onTimeSelect($event)"
      (onBlur)="onTimeChange()"
    ></p-calendar>
    <label for="Time">Select start time</label>
  </p-floatlabel>
  
  <!-- Display the leave message -->
  <div *ngIf="leaveMessage" class="mt-3 p-3 bg-blue-50 border border-blue-200 rounded-md">
    <p class="text-blue-800 font-medium">{{ leaveMessage }}</p>
  </div>
</div>
  
  <!-- New Covering Person Dropdown -->
  <div *ngIf="isSuperAdmin">
    <p-floatlabel class="w-full mt-3">
      <p-select
        formControlName="SelectedEmployee"
        inputId="SelectedEmployee"
        [options]="employeeOptions"
        styleClass="w-full"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        [loading]="isLoadingEmployees"
        [class]="getFilledClass('SelectedEmployee')"
        [showClear]="true"
        [filter]="true"
        filterBy="label"
        [filterMatchMode]="'contains'"
        (onChange)="onEmployeeSelect($event.value)"
      >
      </p-select>
      <label for="SelectedEmployee">Search and Select Employee</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <p-select
        formControlName="CoveringPersonId"
        inputId="CoveringPersonId"
        [options]="coveringPersonOptions"
        styleClass="w-full"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        [loading]="isLoadingEmployees"
        [class]="getFilledClass('CoveringPersonId')"
        [showClear]="true"
        [filter]="true"
        filterBy="label"
        [filterMatchMode]="'contains'"
        (onChange)="onCoveringPersonSelect($event.value)"
      >
      </p-select>
      <label for="CoveringPersonId">Search and Select Covering Person</label>
    </p-floatlabel>
  </div>

  <!-- <div>
    <p-floatlabel class="w-full mt-3">
      <input
        pInputText
        id="RequestedDate"
        formControlName="RequestedDate"
        autocomplete="off"
        class="w-full"
        type="number"
      />
      <label for="RequestedDate">Requested Date</label>
    </p-floatlabel>
  </div> -->
</form>

<!-- Save and Close Buttons -->
<div class="flex justify-evenly sm:justify-end sm:gap-4 mt-10">
  <div>
    <p-button
      label="Close"
      icon="pi pi-times"
      outlined="true"
      class="w-full sm:w-auto"
      (click)="CloseInstances($event)"
    ></p-button>
  </div>
  <div>
    <p-button
      label="Save"
      icon="pi pi-save"
      [loading]="isLoading"
      class="w-full sm:w-auto"
      (click)="save()"
    ></p-button>
  </div>
</div>
