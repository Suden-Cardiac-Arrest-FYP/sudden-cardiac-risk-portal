<form [formGroup]="notificationForm" class="card grid grid-cols-1 gap-4 mt-4">
  <div>
    <p-floatlabel class="w-full mt-3">
      <input
        pInputText
        id="Title"
        formControlName="Title"
        autocomplete="off"
        class="w-full"
      />
      <label for="Title">Title</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <input
        pInputText
        id="Message"
        formControlName="Message"
        autocomplete="off"
        class="w-full"
      />
      <label for="Message">Message</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <p-select
        formControlName="Status"
        inputId="Status"
        [options]="optionsStatus"
        styleClass="w-full"
        optionLabel="label"
        optionValue="value"
        [class]="getFilledClass('Status')"
      >
      </p-select>
      <label for="Status">Status</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <input
        pInputText
        id="Recipient"
        formControlName="Recipient"
        autocomplete="off"
        class="w-full"
      />
      <label for="Recipient">Recipient</label>
    </p-floatlabel>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <p-datepicker
        formControlName="DateSent"
        showIcon
        iconDisplay="input"
        styleClass="w-full"
        appendTo="body"
      />
      <label for="DateSent">Date Sent</label>
    </p-floatlabel>
  </div>
</form>

<!-- Save and Close Buttons -->
<div class="flex justify-evenly sm:justify-end sm:gap-4 mt-10">
  <div>
    <p-button
      label="Close"
      icon="pi pi-times"
      outlined="true"
      class="w-full sm:w-auto"
      (click)="CloseInstances($event)"
    ></p-button>
  </div>
  <div>
    <p-button
      label="Save"
      icon="pi pi-save"
      [loading]="isLoading"
      class="w-full sm:w-auto"
      (click)="save()"
    ></p-button>
  </div>
</div>
