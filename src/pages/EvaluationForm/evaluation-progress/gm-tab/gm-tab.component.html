<div class="p-6">
  <!-- Employee Details Section -->
  <div
    class="bg-surface-0 dark:bg-surface-900 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 mb-6"
  >
    <div class="px-6 py-4 border-b border-surface-200 dark:border-surface-700">
      <h2 class="text-xl font-semibold text-surface-900 dark:text-surface-0">
        Employee Details
      </h2>
    </div>
    <div class="p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-4">
          <div class="flex flex-col">
            <label
              class="font-medium text-sm text-surface-700 dark:text-surface-300 mb-2"
              >Name</label
            >
            <input
              pInputText
              type="text"
              [value]="employeeDetails?.EmployeeName || ''"
              disabled
              class="w-full bg-surface-50 dark:bg-surface-800 border-surface-300 dark:border-surface-600"
            />
          </div>
          <div class="flex flex-col">
            <label
              class="font-medium text-sm text-surface-700 dark:text-surface-300 mb-2"
              >Designation</label
            >
            <input
              pInputText
              type="text"
              [value]="employeeDetails?.Designation || ''"
              disabled
              class="w-full bg-surface-50 dark:bg-surface-800 border-surface-300 dark:border-surface-600"
            />
          </div>
        </div>
        <div class="space-y-4">
          <div class="flex flex-col">
            <label
              class="font-medium text-sm text-surface-700 dark:text-surface-300 mb-2"
              >Join Date</label
            >
            <input
              pInputText
              type="text"
              [value]="employeeDetails?.JoinDate | date : 'dd/MM/yyyy'"
              disabled
              class="w-full bg-surface-50 dark:bg-surface-800 border-surface-300 dark:border-surface-600"
            />
          </div>
          <div class="flex flex-col">
            <label
              class="font-medium text-sm text-surface-700 dark:text-surface-300 mb-2"
              >Year of Evaluation</label
            >
            <input
              pInputText
              type="text"
              [value]="currentYear"
              disabled
              class="w-full bg-surface-50 dark:bg-surface-800 border-surface-300 dark:border-surface-600"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Range Description Section -->
  <div
    class="bg-surface-0 dark:bg-surface-900 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 mb-6"
  >
    <div class="px-6 py-4 border-b border-surface-200 dark:border-surface-700">
      <h2 class="text-xl font-semibold text-surface-900 dark:text-surface-0">
        Range Description
      </h2>
    </div>
    <div class="p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-3">
          <div
            class="flex items-center justify-between p-3 bg-surface-50 dark:bg-surface-800 rounded-lg"
          >
            <span class="font-semibold text-surface-900 dark:text-surface-0"
              >A</span
            >
            <span class="text-surface-700 dark:text-surface-300"
              >91 - 100 EXCELLENT</span
            >
          </div>
          <div
            class="flex items-center justify-between p-3 bg-surface-50 dark:bg-surface-800 rounded-lg"
          >
            <span class="font-semibold text-surface-900 dark:text-surface-0"
              >B</span
            >
            <span class="text-surface-700 dark:text-surface-300"
              >81 - 90 VERY GOOD</span
            >
          </div>
          <div
            class="flex items-center justify-between p-3 bg-surface-50 dark:bg-surface-800 rounded-lg"
          >
            <span class="font-semibold text-surface-900 dark:text-surface-0"
              >C</span
            >
            <span class="text-surface-700 dark:text-surface-300"
              >71 - 80 GOOD</span
            >
          </div>
        </div>
        <div class="space-y-3">
          <div
            class="flex items-center justify-between p-3 bg-surface-50 dark:bg-surface-800 rounded-lg"
          >
            <span class="font-semibold text-surface-900 dark:text-surface-0"
              >D</span
            >
            <span class="text-surface-700 dark:text-surface-300"
              >61 - 70 FAIR</span
            >
          </div>
          <div
            class="flex items-center justify-between p-3 bg-surface-50 dark:bg-surface-800 rounded-lg"
          >
            <span class="font-semibold text-surface-900 dark:text-surface-0"
              >E</span
            >
            <span class="text-surface-700 dark:text-surface-300"
              >51 - 60 AVERAGE</span
            >
          </div>
          <div
            class="flex items-center justify-between p-3 bg-surface-50 dark:bg-surface-800 rounded-lg"
          >
            <span class="font-semibold text-surface-900 dark:text-surface-0"
              >F</span
            >
            <span class="text-surface-700 dark:text-surface-300"
              >< 50 POOR</span
            >
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Evaluation Form Section -->
  <div
    class="bg-surface-0 dark:bg-surface-900 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700 mb-6"
  >
    <div class="px-6 py-4 border-b border-surface-200 dark:border-surface-700">
      <h2 class="text-xl font-semibold text-surface-900 dark:text-surface-0">
        Evaluation Form
      </h2>
    </div>
    <div class="p-6">
      <form (ngSubmit)="onSubmit()" #evaluationForm="ngForm">
        <div class="space-y-6" *ngIf="!isLoading; else loadingTemplate">
          <div
            class="border border-surface-200 dark:border-surface-700 rounded-lg"
            *ngFor="let category of kpiCategories"
          >
            <div
              class="px-6 py-4 bg-surface-50 dark:bg-surface-800 border-b border-surface-200 dark:border-surface-700"
            >
              <h3
                class="text-lg font-semibold text-surface-900 dark:text-surface-0"
              >
                {{ category.KPICategory }}
              </h3>
            </div>
            <div class="p-6">
              <div
                class="space-y-4"
                *ngFor="
                  let description of category.KPIDescription;
                  let last = last
                "
              >
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-center">
                  <div class="lg:col-span-2">
                    <p
                      class="text-surface-700 dark:text-surface-300 font-medium"
                    >
                      {{ description.KPIDescription }}
                    </p>
                  </div>
                  <div class="w-full">
                    <p-select
                      [options]="rangeOptions"
                      [(ngModel)]="
                        selectedRanges[description.KPIDescriptionId!]
                      "
                      [name]="description.KPIDescriptionId || ''"
                      placeholder="Select Range"
                      styleClass="w-full"
                      optionLabel="label"
                      optionValue="value"
                      [showClear]="true"
                      [disabled]="isReadMode"
                    ></p-select>
                  </div>
                </div>
                <div
                  class="border-b border-surface-100 dark:border-surface-700"
                  *ngIf="!last"
                ></div>
              </div>
            </div>
          </div>
        </div>

        <ng-template #loadingTemplate>
          <div class="p-4 text-center flex justify-center items-center py-20">
            <div class="inline-flex items-center space-x-2 text-surface-500">
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="m4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              <span class="text-sm">Loading evaluation form KPIs...</span>
            </div>
          </div>
        </ng-template>
      </form>
    </div>
  </div>

  <!-- Recommendation of GM Section -->
  <div
    class="bg-surface-0 dark:bg-surface-900 rounded-lg shadow-sm border border-surface-200 dark:border-surface-700"
  >
    <div class="px-6 py-4 border-b border-surface-200 dark:border-surface-700">
      <h2 class="text-xl font-semibold text-surface-900 dark:text-surface-0">
        Recommendation of GM
      </h2>
    </div>
    <div class="p-6">
      <form (ngSubmit)="onSubmit()" #recommendationForm="ngForm">
        <!-- Increment and Promotion Dropdowns -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div class="flex flex-col">
            <label
              class="font-medium text-sm text-surface-700 dark:text-surface-300 mb-2"
              >Increment</label
            >
            <p-select
              [options]="yesNoOptions"
              [(ngModel)]="selectedIncrement"
              name="increment"
              placeholder="Select Option"
              styleClass="w-full"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              [disabled]="isReadMode"
            ></p-select>
          </div>
          <div class="flex flex-col">
            <label
              class="font-medium text-sm text-surface-700 dark:text-surface-300 mb-2"
              >Promotion</label
            >
            <p-select
              [options]="yesNoOptions"
              [(ngModel)]="selectedPromotion"
              name="promotion"
              placeholder="Select Option"
              styleClass="w-full"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              [disabled]="isReadMode"
            ></p-select>
          </div>
        </div>

        <!-- Justification Textarea -->
        <div class="flex flex-col mb-6">
          <label
            class="font-medium text-sm text-surface-700 dark:text-surface-300 mb-2"
            >Justification</label
          >
          <textarea
            pInputTextarea
            rows="4"
            [(ngModel)]="recommendation"
            name="recommendation"
            placeholder='If "Yes" / "No" Give the Justification in detail'
            class="w-full resize-none"
            [disabled]="isReadMode"
          ></textarea>
        </div>

        <div
          class="flex justify-end gap-3 mt-8 pt-6 border-t border-surface-200 dark:border-surface-700"
        >
          <p-button
            label="Cancel"
            icon="pi pi-times"
            severity="secondary"
            (click)="onCancel()"
            [outlined]="true"
            styleClass="px-6 py-2"
          ></p-button>
          <p-button
            label="Submit"
            icon="pi pi-check"
            type="submit"
            [loading]="isSubmitting"
            [disabled]="!isFormValid()"
            styleClass="px-6 py-2"
          ></p-button>
        </div>
      </form>
    </div>
  </div>
</div>
