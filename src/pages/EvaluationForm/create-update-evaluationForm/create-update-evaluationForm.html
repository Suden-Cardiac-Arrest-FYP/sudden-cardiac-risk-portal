<form [formGroup]="evaluationFormForm" class="card grid grid-cols-1 gap-4 mt-4">
  <div>
    <p-floatlabel class="w-full mt-3">
      <p-select
        formControlName="EmployeeId"
        inputId="EmployeeId"
        [options]="employees"
        styleClass="w-full"
        optionLabel="displayName"
        optionValue="EmployeeId"
        [filter]="true"
        appendTo="body"
        filterBy="displayName,EpfNumber"
        [showClear]="true"
        [class]="getFilledClass('EmployeeId')"
        (onFilter)="onEmployeeSearch($event)"
      >
        <ng-template pTemplate="item" let-employee>
          <div class="flex flex-col">
            <span class="font-medium">{{ employee.Name }}</span>
            <span class="text-sm text-gray-500"
              >EPF: {{ employee.EpfNumber }}</span
            >
          </div>
        </ng-template>
        <ng-template pTemplate="selectedItem" let-employee>
          <div class="flex flex-col" *ngIf="employee">
            <span class="font-medium">{{ employee.Name }}</span>
            <span class="text-sm text-gray-500"
              >EPF: {{ employee.EpfNumber }}</span
            >
          </div>
        </ng-template>
      </p-select>
      <label for="EmployeeId">Select Employee</label>
    </p-floatlabel>
  </div>
</form>

<!-- Save and Close Buttons -->
<div class="flex justify-evenly sm:justify-end sm:gap-4 mt-10">
  <div>
    <p-button
      label="Close"
      icon="pi pi-times"
      outlined="true"
      class="w-full sm:w-auto"
      (click)="CloseInstances($event)"
    ></p-button>
  </div>
  <div>
    <p-button
      label="Save"
      icon="pi pi-save"
      [loading]="isLoading"
      class="w-full sm:w-auto"
      (click)="save()"
    ></p-button>
  </div>
</div>
