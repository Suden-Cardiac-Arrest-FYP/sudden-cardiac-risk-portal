<form [formGroup]="designationForm" class="card grid grid-cols-1 gap-4 mt-4">
  <div>
    <p-floatlabel class="w-full mt-3">
      <input
        pInputText
        id="Designation"
        formControlName="Designation"
        autocomplete="off"
        class="w-full"
      />
      <label for="Designation">Designation</label>
    </p-floatlabel>

    <small
      *ngIf="
        designationForm.get('Designation')?.touched && designationForm.get('Designation')?.hasError('required')
      "
      class="text-red-600"
    >
      Designation is required.
    </small>
  </div>

  <div>
    <p-floatlabel class="w-full mt-3">
      <textarea
        pTextarea
        id="Description"
        formControlName="Description"
        rows="4"
        cols="30"
        autocomplete="off"
        class="w-full"
      ></textarea>
      <label for="Description">Description</label>
    </p-floatlabel>
  </div>

<!-- Save and Close Buttons -->
<div class="flex justify-evenly sm:justify-end sm:gap-4 mt-10">
  <div>
    <p-button
      label="Close"
      icon="pi pi-times"
      outlined="true"
      class="w-full sm:w-auto"
      (click)="CloseInstances($event)"
    ></p-button>
  </div>
  <div>
    <p-button
      label="Save"
      icon="pi pi-save"
      [loading]="isLoading"
      class="w-full sm:w-auto"
      (click)="save()"
    ></p-button>
  </div>
</div>
