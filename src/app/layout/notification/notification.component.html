<div class="mx-auto">
    <div #notificationContainer
        class="daily-plan-wrapper bg-white dark:bg-surface-900 rounded-2xl shadow-xl border border-surface-200 dark:border-surface-700 overflow-hidden backdrop-blur-sm max-h-[950px] overflow-y-auto">

        <div *ngFor="let notification of notifications"
            class="notification-item group relative p-5 hover:bg-primary-50 dark:hover:bg-surface-900/20 transition-all duration-300 cursor-pointer border-l-4 border-transparent hover:shadow-md"
            (click)="onNotificationClick(notification)">

            <div class="flex items-start">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between mb-2 space-x-4">
                        <!-- Title -->
                        <span
                            class="event-topic font-semibold text-surface-900 dark:text-surface-100 text-sm transition-colors duration-200 truncate flex-1">
                            {{ notification.Title }}
                        </span>

                        <!-- Time -->
                        <span
                            class="event-time text-xs text-surface-500 dark:text-surface-400 bg-surface-100 dark:bg-surface-800 px-2 py-1 rounded-full flex items-center space-x-1 transition-all duration-200 whitespace-nowrap">
                            <span>{{ notification.SentAt | date: 'short' }}</span>
                        </span>

                        <!-- Badge -->
                        <p-badge [value]="notification.MarkAsRead ? 'Read' : 'Unread'"></p-badge>
                    </div>


                    <span
                        class="event-message text-surface-600 dark:text-surface-300 text-sm leading-relaxed block group-hover:text-surface-700 dark:group-hover:text-surface-200 transition-colors duration-200">
                        {{ notification.Content }}
                    </span>
                </div>

                <div class="flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                            clip-rule="evenodd"></path>
                    </svg>
                </div>
            </div>

            <div
                class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
            </div>
        </div>

        <div *ngIf="isLoading" class="p-4 text-center">
            <div class="inline-flex items-center space-x-2 text-surface-500">
                <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="m4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <span class="text-sm">Loading notifications...</span>
            </div>
        </div>

        <div *ngIf="notifications.length === 0 && !isLoading" class="p-8 text-center">
            <div class="w-16 h-16 mx-auto mb-4 bg-surface-100 rounded-full flex items-center justify-center">
                <svg class="w-8 h-8 text-surface-400" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z">
                    </path>
                </svg>
            </div>
            <p class="text-surface-500 text-sm">No notifications yet</p>
        </div>
    </div>
</div>
