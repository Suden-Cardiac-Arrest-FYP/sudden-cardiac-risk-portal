<p-toast></p-toast>
<div
  class="bg-surface-0 border border-black/10 dark:border-white/20 dark:bg-surface-950 w-full flex flex-col md:flex-row">
  <!-- Sidebar for medium screens and up -->
  <div class="hidden md:block h-screen sticky top-0 bg-surface-0 dark:bg-surface-950" style="width: 250px;">
    <app-sidebar *ngIf="appConfigService.sideBarVisibility$ | async" @sidebarSlide></app-sidebar>
  </div>

  <!-- Mobile sidebar -->
  <div class="md:hidden">
    <app-sidebar *ngIf="appConfigService.sideBarVisibility$ | async" @sidebarSlide class="fixed z-50 top-0 left-0 h-screen transform transition-transform
            bg-surface-0 dark:bg-surface-950" [class.translate-x-0]="appConfigService.sideBarVisibility$ | async"
      [class.-translate-x-full]="!(appConfigService.sideBarVisibility$ | async)"></app-sidebar>
  </div>

  <!-- Main content area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-auto">
    <div class="flex justify-between md:justify-end items-center pt-3 md:pt-0 shrink-0 p-2 md:p-6 mt-3 md:mt-5">
      <p-button class="md:hidden mr-5" severity="secondary" (click)="LayoutClick($event,true)"
        icon="pi pi-align-justify">
      </p-button>

      <!-- Controls Section -->
      <div class="flex items-end flex-shrink-0 ml-2 gap-2">

        <p-button (click)="visible = true" icon="pi pi-palette"></p-button>
        <p-button (click)="notificationDrawer = true" icon="pi pi-bell"></p-button>
      </div>
    </div>

    <p-toast></p-toast>

    <div class="flex-1 p-2 md:p-6 overflow-auto">
      <router-outlet></router-outlet>
    </div>

    <p-drawer header="Theme Configurator" [(visible)]="visible"
      styleClass="!w-full md:!w-80 lg:!w-[30rem] rounded-l-2xl" position="right">
      <app-configurator></app-configurator>
    </p-drawer>

    <p-drawer header="Notifications" [(visible)]="notificationDrawer"
      styleClass="!w-full md:!w-80 lg:!w-[30rem] rounded-l-2xl" position="right">
      <app-notification (visibilityChange)="onNotificationVisibilityChange($event)"></app-notification>
    </p-drawer>
  </div>
</div>
